<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1rem;
            display: grid;
            place-items: center;
            background-color: #f4f6f8;
            color: #202124;
            font-family: Arial, sans-serif;
        }

        .registration-card {
            width: min(100%, 1900px);
            height: 900px;
            padding: clamp(1.5rem, 5vw, 3rem);
            background-color: #fff;
            border-radius: 0.75rem;
            box-shadow: 0 0.5rem 1.5rem rgb(0 0 0 / 10%);
        }

        h1 {
            margin-top: 0;
            font-size: clamp(1.6rem, 5vw, 2.25rem);
        }

        .form-field {
            margin-bottom: 1.25rem;
        }

        label,
        legend {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"],
        select {
            width: 100%;
            min-height: 2.75rem;
            padding: 0.65rem 0.75rem;
            border: 1px solid #767676;
            border-radius: 0.35rem;
            background-color: #fff;
            color: inherit;
            font: inherit;
        }

        input[type="text"],
        input[type="email"] {
            background-color: #000;
            color: #fff;
        }

        fieldset {
            min-width: 0;
            margin: 0 0 1.25rem;
            padding: 0;
            border: 0;
        }

        .radio-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem 1.25rem;
        }

        .radio-option {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin: 0;
            font-weight: 400;
        }

        input[type="radio"] {
            width: 1rem;
            height: 1rem;
            margin: 0;
            accent-color: #174ea6;
        }

        input:focus-visible,
        select:focus-visible,
        button:focus-visible {
            outline: 3px solid #174ea6;
            outline-offset: 2px;
        }

        button {
            min-height: 2.75rem;
            padding: 0.7rem 1rem;
            border: 0;
            border-radius: 0.35rem;
            background-color: #174ea6;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background-color: #123f87;
        }

    </style>
</head>
<body>
    <div>
    <main class="registration-card">
        <h1>Student Registration Portal</h1>
        <form action="/submit-course-selection" method="POST">
            <div class="form-field">
                <label for="full-name">Full name</label>
                <input type="text" id="full-name" name="full_name" autocomplete="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="Enter your email address" required>
            </div>

            <fieldset>
                <legend>Gender</legend>
                <div class="radio-options">
                    <label class="radio-option" for="male">
                        <input type="radio" id="male" name="gender" value="male" required>
                        Male
                    </label>
                    <label class="radio-option" for="female">
                        <input type="radio" id="female" name="gender" value="female">
                        Female
                    </label>
                    <label class="radio-option" for="other">
                        <input type="radio" id="other" name="gender" value="other">
                        Other
                    </label>
                </div>
            </fieldset>

            <div class="form-field">
                <label for="course-select">Select your course</label>
                <select id="course-select" name="selected_course" required>
                    <option value="" disabled selected>Choose a course</option>
                    <option value="web-development">Web Development</option>
                    <option value="data-science">Data Science</option>
                    <option value="graphic-design">Graphic Design</option>
                    <option value="digital-marketing">Digital Marketing</option>
                </select>
            </div>

            <button type="submit">Submit registration</button>
        </form>
    </main>
    <script>
        document.querySelector("form").addEventListener("submit", (event) => {
            event.preventDefault();
            window.location.href = "message%27html";
        });
    </script>
    </div>
</body>
</html>
